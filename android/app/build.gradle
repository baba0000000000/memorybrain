plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.memorycapture'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.memorycapture'
        minSdk 34
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}
