org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true

# Sous-dossier de la bibliothèque audio (MediaStore) où l'application publie
# ses segments d'une minute. C'est ce dossier que votre outil de
# synchronisation doit reprendre. Mettez ici le nom que vous voulez :
#   memorybrain.audioDir=Music/MemoryAudio
# La valeur par défaut, utilisée si la clé est absente, est Music/MemoryAudio.
memorybrain.audioDir=Music/MemoryAudio
